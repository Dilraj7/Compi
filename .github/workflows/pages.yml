# Publie le site de Compi (dossier site/) sur GitHub Pages : https://dilraj7.github.io/Compi/
# À activer une fois : Settings › Pages › Source : « GitHub Actions » (dépôt public).
name: Site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - resources/icon.png
      - scripts/site.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Assemble out/site et échoue si un lien local ou une ancre est cassé.
      - run: node scripts/site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out/site
      - id: deployment
        uses: actions/deploy-pages@v4
