appId: com.compi.app
productName: Compi
copyright: Compi — MIT
directories:
  buildResources: resources
  output: dist
# Seulement ce qui sert à l'app : ni le site GitHub Pages (out/site), ni les cartes de
# code (.map), ni les sources et déclarations TypeScript des paquets, ni leurs
# versions pour navigateur (exceljs/dist, mammoth.browser, browser-sdk).
files:
  - out/**
  - '!out/site/**'
  - '!out/site-*'
  - package.json
  - '!**/*.map'
  - '!node_modules/**/*.{ts,mts,cts}'
  - '!node_modules/exceljs/dist/**'
  - '!node_modules/mammoth/mammoth.browser*.js'
  - '!node_modules/@anthropic-ai/claude-agent-sdk/browser-sdk.js'
# Langues de Chromium (menus contextuels, boîtes de dialogue) : l'app est en français.
electronLanguages:
  - fr
  - en-US
extraResources:
  - from: resources
    to: resources
    filter:
      - '*.png'
# Le moteur de l'agent (claude.exe) doit rester exécutable : hors de l'archive asar.
# Idem pour les modules natifs de la dictée partout (sherpa-onnx et ses DLL, uiohook).
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  - node_modules/sherpa-onnx-*/**
  - node_modules/uiohook-napi/**
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  artifactName: Compi-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Compi
  uninstallDisplayName: Compi
  deleteAppDataOnUninstall: false
